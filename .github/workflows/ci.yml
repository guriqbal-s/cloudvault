# Runs on every push and pull request: backend tests, frontend build, and a build of all
# three container images (api, migrate, web), so a broken Dockerfile is caught before deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          for target in api migrate web; do
            docker buildx build --target "$target" --tag "cloudvault-$target:ci" .
          done
      - name: Validate the production compose files
        env:
          DOMAIN: ci.example.com
          ACME_EMAIL: ci@example.com
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
