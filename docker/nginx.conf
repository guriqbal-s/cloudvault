# Serves the built React app and load-balances API + WebSocket traffic across every api
# container, so the browser sees a single origin (needed for the SameSite=Strict refresh cookie).

# Docker's internal DNS. "resolve" below re-reads it, so scaled or restarted api replicas are
# picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
  zone api_upstream 64k;
  # Same client -> same instance while the replica set is stable. Only Socket.IO's long-polling
  # fallback needs this; WebSocket and REST calls work on any instance.
  hash $remote_addr consistent;
  server api:4000 resolve;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Keep in step with MAX_UPLOAD_BYTES (20 files per request are allowed)
  client_max_body_size 2g;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream uploads and downloads instead of buffering them in nginx
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # Retry idempotent requests on another replica if one is restarting
    proxy_next_upstream error timeout http_502 http_503;
  }

  location /socket.io/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
