# Security headers for the React app (index.html and its assets). Included from each
# location in nginx.conf, because an add_header inside a location replaces server-level ones.
# /api responses get their own, stricter headers from the API (helmet).
#
# CSP notes:
#   - fonts.googleapis.com / fonts.gstatic.com: the web fonts linked from index.html
#   - blob: and data: for avatars, previews and generated thumbnails
#   - frame-src 'self' blob: for PDF previews served from /api
#   - wss://$host for Socket.IO (some browsers do not cover ws: with 'self')
#   - style-src 'unsafe-inline': component libraries inject small <style> blocks; scripts stay strict
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://$host ws://$host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
